<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="روتينك - تطبيق لمتابعة العادات اليومية وشرب المياه والتركيز والملاحظات">
<link rel="manifest" href="./manifest.json">
<title>روتينك - Life Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0f172a;--card:rgba(30,41,59,.82);--border:rgba(255,255,255,.09);--primary:#6366f1;--cyan:#06b6d4;--green:#10b981;--muted:#94a3b8;--red:#ef4444;--yellow:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0;font-family:Cairo,sans-serif}
body{background:radial-gradient(circle at top right,#1e1b4b,var(--bg));color:#f8fafc;min-height:100vh;padding-bottom:40px}
button,input,textarea{font:inherit}
.navbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 5%;background:rgba(15,23,42,.9);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.logo{font-size:1.2rem;font-weight:800;color:var(--primary)}
.profile{display:flex;align-items:center;gap:10px;font-size:.85rem}
.container{max-width:1100px;margin:25px auto;padding:0 15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.card,.auth-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 10px 30px #0003}
.card h2{font-size:1.05rem;margin-bottom:16px}
.card h2 i{color:var(--primary);margin-left:8px}
.value{text-align:center;font-size:2rem;font-weight:800;color:var(--cyan);margin:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--primary);color:white;font-weight:700;cursor:pointer}
button:active{transform:scale(.98)}
.secondary{background:#06b6d426;color:var(--cyan);border:1px solid #06b6d455}
.danger{background:#ef444426;color:#ff7777;border:1px solid #ef444455}
.habit{display:flex;align-items:center;gap:10px;padding:12px;margin:8px 0;border:1px solid var(--border);border-radius:12px;background:#0f172a66;cursor:pointer}
.habit.done{border-color:var(--green);background:#10b98118;color:var(--muted);text-decoration:line-through}
.timer{font:800 3rem monospace;text-align:center;color:var(--yellow);margin:14px}
textarea{width:100%;min-height:120px;background:#0f172a99;border:1px solid var(--border);border-radius:12px;padding:12px;color:white;resize:vertical}
.auth-overlay{position:fixed;inset:0;background:#0f172af2;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.auth-card{width:100%;max-width:420px;text-align:center}
.auth-card h1{color:var(--primary);margin-bottom:8px}
.auth-card p{color:var(--muted);font-size:.9rem;margin-bottom:20px}
.field{text-align:right;margin:12px 0}
.field label{display:block;color:var(--muted);font-size:.85rem;margin-bottom:5px}
.field input{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:#0f172a;color:white}
.full{width:100%;margin-top:8px}
.msg{font-size:.85rem;color:#f87171;margin-top:10px;display:none}
.hint{font-size:.78rem;color:var(--muted);margin-top:12px}
@media(max-width:480px){.navbar{padding:12px}.logo{font-size:1rem}.profile{font-size:.75rem}.card{padding:16px}}
</style>
</head>
<body>
<div id="auth" class="auth-overlay">
 <div class="auth-card">
  <h1><i class="fa-solid fa-bolt"></i> روتينك</h1>
  <p id="authSubtitle">سجل دخولك لمزامنة عاداتك وروتينك اليومي</p>
  <div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></div>
  <div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور"></div>
  <button id="authButton" class="full" onclick="handleAuth()">تسجيل الدخول</button>
  <div id="authError" class="msg"></div>
  <p class="hint"><span id="toggleLabel">ليس لديك حساب؟</span> <a href="#" id="toggleLink" onclick="toggleMode(event)" style="color:var(--cyan)">إنشاء حساب جديد</a></p>
 </div>
</div>
<nav class="navbar">
 <div class="logo"><i class="fa-solid fa-bolt"></i> روتينك - Life Tracker</div>
 <div class="profile"><span id="userDisplay">مستخدم</span><button class="danger" onclick="logout()" title="تسجيل الخروج"><i class="fa-solid fa-right-from-bracket"></i></button></div>
</nav>
<main class="container">
 <div class="grid">
  <section class="card"><h2><i class="fa-solid fa-glass-water"></i> متابعة شرب الماء</h2><div class="value" id="waterValue">0 / 2500 ML</div><div class="actions"><button class="secondary" onclick="addWater(250)">+ 250 ML</button><button class="secondary" onclick="addWater(500)">+ 500 ML</button><button class="danger" onclick="resetWater()">إعادة ضبط</button></div></section>
  <section class="card"><h2><i class="fa-solid fa-list-check"></i> الروتين والعادات اليومية</h2><div id="habitsList"></div></section>
  <section class="card"><h2><i class="fa-solid fa-clock"></i> مؤقت العمل والتركيز</h2><div class="timer" id="timerDisplay">25:00</div><div class="actions"><button onclick="startTimer()">بدء الجلسة</button><button class="danger" onclick="resetTimer()">إيقاف وإعادة ضبط</button></div></section>
  <section class="card" style="grid-column:1/-1"><h2><i class="fa-solid fa-pen-to-square"></i> ملاحظات ويوميات اليوم</h2><textarea id="notes" placeholder="اكتب أفكارك وملاحظاتك عن اليوم..."></textarea><div class="hint" id="saveStatus">تُحفظ الملاحظات تلقائيًا عند مغادرة مربع الكتابة.</div></section>
 </div>
</main>
<script>
// Firebase Web App configuration.
// أكمل apiKey و appId من Firebase Console > Project settings > Your apps.
const firebaseConfig = {
  apiKey: "ضع_apiKey_هنا",
  authDomain: "lifetracker-7002e.firebaseapp.com",
  projectId: "lifetracker-7002e",
  storageBucket: "lifetracker-7002e.appspot.com",
  messagingSenderId: "ضع_messagingSenderId_هنا",
  appId: "ضع_appId_هنا"
};
let auth=null, db=null, currentUser=null, isSignUp=false, saveTimer=null;
let state={water:0,habits:[
 {id:"sleep",name:"النوم المبكر (7-8 ساعات)",done:false},
 {id:"eat",name:"تناول الوجبات المتوازنة",done:false},
 {id:"shower",name:"الاستحمام والعناية الشخصية",done:false},
 {id:"work",name:"إنجاز ساعات العمل اليومية",done:false}
],notes:""};
const $=id=>document.getElementById(id);
function showError(message){$("authError").textContent=message;$("authError").style.display="block"}
function toggleMode(e){e.preventDefault();isSignUp=!isSignUp;$("authSubtitle").textContent=isSignUp?"إنشاء حساب جديد لمتابعة روتينك":"سجل دخولك لمزامنة عاداتك وروتينك اليومي";$("authButton").textContent=isSignUp?"إنشاء حساب":"تسجيل الدخول";$("toggleLabel").textContent=isSignUp?"لديك حساب بالفعل؟":"ليس لديك حساب؟";$("toggleLink").textContent=isSignUp?"تسجيل الدخول":"إنشاء حساب جديد";$("authError").style.display="none"}
function handleAuth(){
 const email=$("email").value.trim(),password=$("password").value;
 $("authError").style.display="none";
 if(!email||!password)return showError("يرجى إدخال البريد الإلكتروني وكلمة المرور");
 if(!auth)return showError("إعدادات Firebase غير مكتملة. أضف بيانات التطبيق في firebaseConfig أولًا.");
 const task=isSignUp?auth.createUserWithEmailAndPassword(email,password):auth.signInWithEmailAndPassword(email,password);
 task.catch(err=>showError(isSignUp?friendlyError(err):"تعذر تسجيل الدخول. تحقق من البريد الإلكتروني وكلمة المرور."));
}
function friendlyError(err){const map={"auth/email-already-in-use":"البريد الإلكتروني مستخدم بالفعل","auth/invalid-email":"البريد الإلكتروني غير صحيح","auth/weak-password":"كلمة المرور ضعيفة؛ استخدم 6 أحرف على الأقل","auth/operation-not-allowed":"فعّل Email/Password من Firebase Authentication"};return map[err.code]||"تعذر إنشاء الحساب: "+err.message}
function logout(){if(auth)auth.signOut()}
function defaultState(){return {water:0,habits:[
 {id:"sleep",name:"النوم المبكر (7-8 ساعات)",done:false},
 {id:"eat",name:"تناول الوجبات المتوازنة",done:false},
 {id:"shower",name:"الاستحمام والعناية الشخصية",done:false},
 {id:"work",name:"إنجاز ساعات العمل اليومية",done:false}
],notes:""}}
function todayKey(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function userDoc(){return db.collection("users").doc(currentUser.uid).collection("days").doc(todayKey())}
async function loadData(){
 state=defaultState();
 try{const doc=await userDoc().get();if(doc.exists){const data=doc.data();state={...state,...data};if(!Array.isArray(state.habits))state.habits=defaultState().habits}}
 catch(e){$("saveStatus").textContent="تعذر تحميل البيانات من السحابة. تحقق من الاتصال وإعدادات Firestore."}
 render();
}
function saveData(){
 if(!currentUser||!db)return;
 $("saveStatus").textContent="جاري الحفظ...";
 userDoc().set({...state,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})
 .then(()=>$("saveStatus").textContent="تم الحفظ والمزامنة")
 .catch(()=>$("saveStatus").textContent="تعذر الحفظ. تحقق من الاتصال وقواعد Firestore.");
}
function render(){
 $("waterValue").textContent=`${state.water||0} / 2500 ML`;
 $("habitsList").innerHTML="";
 state.habits.forEach((habit,index)=>{
  const el=document.createElement("div");el.className="habit"+(habit.done?" done":"");
  const icon=document.createElement("i");icon.className=habit.done?"fa-regular fa-circle-check":"fa-regular fa-circle";
  const label=document.createElement("span");label.textContent=habit.name;
  el.append(icon,label);el.onclick=()=>{state.habits[index].done=!state.habits[index].done;render();saveData()};$("habitsList").appendChild(el);
 });
 if(document.activeElement!==$("notes"))$("notes").value=state.notes||"";
}
function addWater(amount){state.water=Math.min(5000,(Number(state.water)||0)+amount);render();saveData()}
function resetWater(){state.water=0;render();saveData()}
$("notes").addEventListener("change",()=>{state.notes=$("notes").value;saveData()});
$("notes").addEventListener("blur",()=>{state.notes=$("notes").value;saveData()});
let timer=null,timeLeft=1500;
function updateTimer(){const m=String(Math.floor(timeLeft/60)).padStart(2,"0"),s=String(timeLeft%60).padStart(2,"0");$("timerDisplay").textContent=`${m}:${s}`}
function startTimer(){if(timer)return;timer=setInterval(()=>{if(timeLeft<=0){clearInterval(timer);timer=null;alert("انتهت جلسة التركيز والعمل!");resetTimer();return}timeLeft--;updateTimer()},1000)}
function resetTimer(){if(timer)clearInterval(timer);timer=null;timeLeft=1500;updateTimer()}
if("serviceWorker" in navigator && location.protocol!=="file:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
try{
 const configured=firebaseConfig.apiKey!=="ضع_apiKey_هنا"&&firebaseConfig.appId!=="ضع_appId_هنا";
 if(configured&&window.firebase){firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();
  auth.onAuthStateChanged(async user=>{currentUser=user;if(user){$("auth").style.display="none";$("userDisplay").textContent=user.email;await loadData()}else{$("auth").style.display="flex";$("userDisplay").textContent="مستخدم"}})
 }else{$("auth").style.display="flex";showError("أضف apiKey و appId وباقي بيانات Firebase في هذا الملف لتفعيل الحسابات والمزامنة.");}
}catch(e){showError("حدث خطأ في إعداد Firebase: "+e.message)}
</script>
</body>
</html>
